name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        # Set health checks to wait until mysql has started
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
        

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=119 --statistics
    - name: Debug MySQL Connection
      run: cat /etc/hosts
      
    - name: View MySQL Container Logs
      run: docker logs mysql

    - name: Install MySQL client
      run: sudo apt-get install default-mysql-client
    - name: Wait for MySQL
      run: |
        until mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1"; do
          sleep 1
        done

    - name: Run Migration
      run: |
        python manage.py migrate

    - name: Run Tests
      run: | 
        coverage run manage.py test
