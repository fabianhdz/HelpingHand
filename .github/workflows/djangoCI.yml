name: Django CI
env:
    MYSQL_DATABASE: helpinghanddb
    MYSQL_USERNAME: root_user
    MYSQL_PASSWORD: Dtcsci6333!
    MYSQL_HOST: mysql-master
    NODE_ENV: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    services:
      mysql-master:
        image: mysql:5.7
        ports:
          - 3306/tcp
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USERNAME: ${{ env.MYSQL_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        options: >-
          --name=mysql-master
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=119 --statistics
    - name: Debug MySQL Connection
      run: cat /etc/hosts
      
    - name: View MySQL Container Logs
      run: docker logs mysql

    - name: Run Migration
      run: |
        python manage.py migrate

    - name: Run Tests
      run: | 
        coverage run manage.py test
