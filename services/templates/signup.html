{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h2 class="mb-4 text-center">Create Account</h2>
            <form method="post" class="needs-validation">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="id_username">Username:</label>
                    <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required>
                    <div class="invalid-feedback">
                        Please choose a username.
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6 mb-3">
                        <label for="id_first_name">First name:</label>
                        <input type="text" name="first_name" class="form-control" id="id_first_name" placeholder="First name">
                    </div>
                    <div class="form-group col-md-6 mb-3">
                        <label for="id_last_name">Last name:</label>
                        <input type="text" name="last_name" class="form-control" id="id_last_name" placeholder="Last name">
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="id_email">Email address:</label>
                    <input type="email" name="email" class="form-control" id="id_email" placeholder="Email address" required>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="id_password1">Password:</label>
                    <input type="password" name="password1" class="form-control" id="id_password1" placeholder="Password" required>
                    <div class="invalid-feedback">
                        Please enter a password.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="id_password2">Password confirmation:</label>
                    <input type="password" name="password2" class="form-control" id="id_password2" placeholder="Confirm Password" required>
                    <div class="invalid-feedback">
                        Please confirm the password.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="id_phone">Phone:</label>
                    <input type="tel" name="phone" class="form-control" id="id_phone" placeholder="Phone number" required>
                </div>
                <div class="form-group mb-3">
                    <label for="id_language">Language:</label>
                    <input type="text" name="language" class="form-control" id="id_language" placeholder="Language">
                </div>
                <div class="form-group mb-3">
                    <label for="id_address">Address:</label>
                    <input type="text" name="address" class="form-control" id="id_address" placeholder="Address">
                </div>
                <div class="form-group mb-4">
                    <label for="id_zip_code">Zip code:</label>
                    <input type="text" name="zip_code" class="form-control" id="id_zip_code" placeholder="Zip code">
                </div>
                <div class="form-group mb-4 px-5">
                    <button type="submit" class="btn btn-primary w-100">Sign up</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
