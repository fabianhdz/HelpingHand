{% extends 'base.html' %}

{% block content %}

<div class="col-md-6 offset-md-3">

{% if user.is_authenticated %}



    <div class="hero-unit mb-3">
        <a href="{% url 'create_post' %}" class="btn btn-primary btn-large">Create Post</a> 
    </div>
    
    <div class="hero-unit mb-3">
      <a href="{% url 'posts_feed' %}" class="btn btn-primary btn-large">Go to Post Feed</a> 
  </div>


{% else %}

<h1>Welcome: Login Below</h1>
<br/>
<br/>

<form method="POST" action="{% url 'home' %}">
    {% csrf_token %}
    <form>
        <div class="mb-3">
          <input type="text" class="form-control" name="username", placeholder="Username" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" name="password", placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
</form>


<p class="mt-3">
  Don't have an account? <a href="{% url 'signup_user' %}">Create Account</a>
</p>


</div>

{% endif %}

{% endblock %}
